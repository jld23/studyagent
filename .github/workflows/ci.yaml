name: AgentOps CI & Evaluation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  agentops-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: 1. Run AgentOps 19-Criteria Matrix Audit
        run: |
          uv run python scripts/agentops_audit.py

      - name: 2. Run Pytest Unit & Integration Tests
        run: |
          uv run pytest tests/ -v --tb=short

      - name: 3. Run Golden Dataset Agent Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run pytest tests/eval/test_eval_dataset.py -v
